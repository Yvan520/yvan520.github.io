name: Daily Auto News

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run auto-news
        id: news
        run: node scripts/auto-news.mjs

      - name: Commit news
        run: |
          git config user.name 'RO3 Auto News'
          git config user.email 'auto-news@ro3.gamewayz.com'
          git add docs/news/ docs/index.md
          git diff --staged --quiet || git commit -m 'feat: auto news digest'
          git push
