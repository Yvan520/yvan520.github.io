name: Daily Auto News

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  auto-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and generate news
        id: news
        run: node scripts/auto-news.mjs

      - name: Commit and push
        if: steps.news.outputs.new_content == 'true'
        run: |
          git config user.name 'RO3 Auto News'
          git config user.email 'auto-news@ro3.gamewayz.com'
          git add -A
          git commit -m 'feat: auto news digest'
          git push
